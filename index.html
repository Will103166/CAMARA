<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12110e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="時間相機">
  <title>時間相機</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app">
    <section id="gate" class="gate">
      <p class="eyebrow">現場記錄</p>
      <h1>時間相機</h1>
      <p class="lede">按下快門後，把拍攝時間、座標、地點和天氣寫進照片。</p>
      <div class="stack">
        <button id="start" class="primary" type="button">開啟相機</button>
        <button id="install" class="ghost" type="button" hidden>安裝到主畫面</button>
      </div>
      <p id="gate-note" class="fine">相機與定位會先詢問權限。地點與天氣需要連線，時間以這台裝置為準。</p>
    </section>

    <section id="camera" class="stage" hidden>
      <video id="preview" playsinline autoplay muted></video>
      <div id="grid" class="thirds" hidden>
        <span></span><span></span><span></span><span></span>
      </div>
      <div id="level" class="level" hidden>
        <div id="level-line" class="level-line"></div>
      </div>
      <div id="level-mark" class="level-mark" hidden></div>
      <p id="level-readout" class="level-readout" hidden></p>
      <div class="scrim-top">
        <p id="status" class="pill" aria-live="polite">準備中</p>
        <button id="open-settings" class="gear" type="button" aria-label="設定">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.22-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.4 1.05.72 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.58-.22 1.13-.54 1.63-.94l2.39.96c.23.1.5 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
          </svg>
        </button>
      </div>
      <div class="hud" aria-hidden="true">
        <p id="hud-clock" class="clock">--:--:--</p>
        <p id="hud-meta" class="sub">預覽，按下快門後才寫入照片</p>
      </div>
      <div class="zoombar">
        <span id="zoom-label">1.0×</span>
        <input id="zoom" type="range" min="1" max="4" step="0.1" value="1" aria-label="縮放">
      </div>
      <p id="toast" class="toast" hidden></p>
      <div class="dock">
        <div class="side">
          <button id="pick" class="iconbtn" type="button">相簿</button>
        </div>
        <button id="shutter" class="shutter" type="button" aria-label="拍照"></button>
        <div class="side right">
          <button id="flip" class="iconbtn" type="button">翻轉</button>
        </div>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
    </section>

    <section id="result" class="result" hidden>
      <img id="shot" alt="已寫入時間與地點的照片">
      <div class="sheet">
        <div id="meta" class="meta"></div>
        <div class="actions">
          <button id="retake" class="plain" type="button">重拍</button>
          <button id="save" class="plain" type="button">儲存</button>
          <button id="share" class="grow" type="button">分享</button>
        </div>
      </div>
    </section>

    <section id="settings" class="settings" hidden>
      <div class="settings-bar">
        <h2>設定</h2>
        <button id="settings-close" class="done" type="button">完成</button>
      </div>
      <div class="settings-scroll">
        <label class="set-block">
          <span>字型</span>
          <select id="font">
            <option value="sans">黑體</option>
            <option value="serif">明體</option>
            <option value="system">系統字型</option>
          </select>
        </label>
        <label class="set-block">
          <span>文字大小 <b id="text-scale-label">100%</b></span>
          <input id="text-scale" type="range" min="0.7" max="1.6" step="0.05" value="1">
        </label>
        <p id="stamp-sample" class="stamp-sample"></p>
        <div class="set-row">
          <span>九宮格</span>
          <button id="grid-toggle" class="switch" type="button" aria-pressed="false"><i></i></button>
        </div>
        <label class="set-block">
          <span>天氣資料來源</span>
          <select id="weather-source">
            <option value="open-meteo">Open-Meteo</option>
            <option value="wttr">wttr.in</option>
          </select>
          <p class="hint">wttr.in 若被瀏覽器擋住，會改查 Open-Meteo。</p>
        </label>
        <div class="set-row">
          <span>時間格式</span>
          <div class="segment" role="group" aria-label="時間格式">
            <button id="hour-24" type="button" class="is-on" aria-pressed="true">24 小時</button>
            <button id="hour-12" type="button" aria-pressed="false">12 小時</button>
          </div>
        </div>
        <div class="set-row">
          <span>拍照聲</span>
          <button id="sound-toggle" class="switch" type="button" aria-pressed="true"><i></i></button>
        </div>
        <div class="set-block">
          <span>浮水印位置與順序</span>
          <p class="hint">座標、地點、天氣和時間可以各自開關、排序，並放到照片的九個位置。同一格會由上到下排成一組。</p>
          <div id="field-list"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
